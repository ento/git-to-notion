on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org https://nixpkgs-python.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nixpkgs-python.cachix.org-1:hxjI7pFxTyuTHn2NkvWCrAUcNZLNS3ZAvfYNuYifcEU=
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - uses: actions/checkout@v6
      - uses: ./
        with:
          source-dir: .
          notion-token: ${{ secrets.SMOKE_TEST_NOTION_TOKEN }}
          page-id: ${{ secrets.SMOKE_TEST_NOTION_PAGE_ID }}
          git-url-base: https://github.com/ento/git-to-notion/
